<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Live Support Overlay</title>
  <style>
    :root {
      color-scheme: dark;
      --amber: #ffb434;
      --amber-soft: rgba(255, 180, 52, .54);
      --scale: 1;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Courier New", Courier, monospace;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .banner {
      position: relative;
      isolation: isolate;
      container-type: inline-size;
      width: min(100vw, 850px);
      aspect-ratio: 850 / 240;
      overflow: hidden;
      color: var(--amber);
      font-weight: 600;
      filter: none;
    }

    .aura {
      position: absolute;
      z-index: -2;
      inset: 15% 8%;
      background:
        radial-gradient(ellipse at 22% 52%, rgba(255, 180, 52, .14), transparent 30%),
        radial-gradient(ellipse at 68% 53%, rgba(255, 180, 52, .12), transparent 40%);
      filter: blur(11px);
      transform-origin: center;
      animation: aura-breathe 3.2s ease-in-out infinite;
      will-change: opacity, transform;
    }

    @keyframes aura-breathe {
      0%, 100% { opacity: .62; transform: scale(.96); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    /* A still, lightweight grain layer adds texture without a network asset. */
    .grain {
      position: absolute;
      z-index: -1;
      inset: 5% 1%;
      width: 98%;
      height: 90%;
      opacity: .19;
      pointer-events: none;
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 78%);
    }

    .content {
      position: absolute;
      inset: 10% 5% 9% 5%;
      display: grid;
      grid-template-columns: 20% 1fr;
      align-items: center;
    }

    .mark-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 0 5px rgba(255, 180, 52, .28));
    }

    .mark-wrap::after {
      content: "";
      position: absolute;
      top: 24%;
      right: 0;
      width: 3px;
      height: 52%;
      background: rgba(255, 180, 52, .62);
      box-shadow: 0 0 5px rgba(255, 180, 52, .24);
    }

    .mark {
      position: absolute;
      width: 90%;
      height: 90%;
      overflow: visible;
      object-fit: contain;
    }

    .mark.echo {
      opacity: 0;
      filter: none;
    }

    .mark.echo-a { filter: brightness(1.35); }
    .mark.echo-b { filter: hue-rotate(-18deg) saturate(1.3); }
    .mark:not(.echo) { transform: translateX(-7px) scale(.92); }

    .mark-wrap.glitching .echo-a {
      animation: logo-slice-a 430ms steps(2, end) both;
    }

    .mark-wrap.glitching .echo-b {
      animation: logo-slice-b 430ms steps(2, end) both;
    }

    @keyframes logo-slice-a {
      0%, 100% { opacity: 0; transform: translateX(0); clip-path: inset(0 0 100% 0); }
      15%, 45% { opacity: .9; transform: translateX(-4px); clip-path: inset(17% 0 59% 0); }
      65% { opacity: .7; transform: translateX(3px); clip-path: inset(65% 0 12% 0); }
    }

    @keyframes logo-slice-b {
      0%, 100% { opacity: 0; transform: translateX(0); clip-path: inset(100% 0 0 0); }
      23%, 58% { opacity: .8; transform: translateX(4px); clip-path: inset(45% 0 32% 0); }
      77% { opacity: .55; transform: translateX(-3px); clip-path: inset(8% 0 73% 0); }
    }

    .copy {
      position: relative;
      min-width: 0;
      padding-left: 5.4%;
      display: grid;
      align-content: center;
      gap: 5%;
      height: 100%;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 2.4%;
      font-size: 5.1cqw;
      line-height: 1;
      letter-spacing: .31em;
      text-shadow: 0 0 9px rgba(255, 180, 52, .62);
    }

    .live-dot {
      flex: 0 0 auto;
      width: .72em;
      height: .72em;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px rgba(255, 180, 52, .9), 0 0 20px rgba(255, 180, 52, .58);
      animation: live-blink 1s steps(1, end) infinite;
      will-change: opacity;
    }

    @keyframes live-blink {
      0%, 49%, 100% { opacity: 1; }
      50%, 85% { opacity: .2; }
    }

    .message-row {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
      font-size: 4.8cqw;
      line-height: 1.08;
      letter-spacing: .245em;
      text-shadow: 0 0 8px rgba(255, 180, 52, .6);
    }

    .message {
      position: relative;
      display: inline-block;
      max-width: 100%;
      white-space: nowrap;
    }

    .message::before,
    .message::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .message::before { color: #fff0c9; }
    .message::after { color: #ff813a; }

    .message.glitching::before { animation: text-slice-a 380ms steps(2, end) both; }
    .message.glitching::after { animation: text-slice-b 380ms steps(2, end) both; }

    @keyframes text-slice-a {
      0%, 100% { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateX(0); }
      20%, 55% { opacity: .8; clip-path: inset(4% 0 68% 0); transform: translateX(-3px); }
      72% { opacity: .65; clip-path: inset(63% 0 17% 0); transform: translateX(2px); }
    }

    @keyframes text-slice-b {
      0%, 100% { opacity: 0; clip-path: inset(100% 0 0 0); transform: translateX(0); }
      28%, 64% { opacity: .75; clip-path: inset(39% 0 37% 0); transform: translateX(3px); }
      82% { opacity: .5; clip-path: inset(76% 0 5% 0); transform: translateX(-2px); }
    }

    .loading-line {
      position: absolute;
      left: 5.4%;
      top: calc(50% + 6.3cqw);
      display: flex;
      align-items: center;
      width: max-content;
      font-size: 2.5cqw;
      line-height: 1;
      letter-spacing: .22em;
      text-shadow: 0 0 9px rgba(255, 180, 52, .4);
      opacity: .82;
      pointer-events: none;
    }

    .typed-loading {
      display: inline-block;
      width: 0;
      overflow: hidden;
      white-space: nowrap;
      animation: loading-type 3s steps(3, end) infinite;
    }

    .loading-cursor {
      display: inline-block;
      width: .07em;
      height: .9em;
      margin-left: .12em;
      background: var(--amber);
      box-shadow: 0 0 7px rgba(255, 180, 52, .6);
      animation: cursor-blink .72s steps(1, end) infinite;
    }

    @keyframes loading-type {
      0%, 5% { width: 0; }
      42%, 80% { width: 2.25em; }
      92%, 100% { width: 0; }
    }

    @keyframes cursor-blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation-duration: 2.8s; }
    }
  </style>
</head>
<body>
  <main class="banner" aria-label="Live support overlay">
    <div class="aura" aria-hidden="true"></div>
    <svg class="grain" viewBox="0 0 850 240" preserveAspectRatio="none" aria-hidden="true">
      <filter id="grain-noise" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="7" stitchTiles="stitch" />
        <feColorMatrix values=".35 0 0 0 .4  0 .25 0 0 .25  0 0 .08 0 0  0 0 0 .24 0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#grain-noise)" />
    </svg>

    <div class="content">
      <div class="mark-wrap" id="logo">
        <img class="mark echo echo-a" src="./logo.png" alt="" aria-hidden="true">
        <img class="mark echo echo-b" src="./logo.png" alt="" aria-hidden="true">
        <img class="mark" src="./logo.png" alt="Logo">
      </div>

      <section class="copy" aria-label="Status siaran dan pesan dukungan">
        <div class="live"><span class="live-dot" aria-hidden="true"></span><span>LIVE</span></div>
        <div class="message-row"><span class="message" id="message" data-text="SUPPORT ON BIO" aria-live="off">SUPPORT ON BIO</span></div>
        <div class="loading-line" aria-hidden="true"><span class="typed-loading">///</span><span class="loading-cursor"></span></div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const messages = ["SUPPORT ON BIO", "MEDIASHARE ON", "FOLLOW FOR MORE"];
      const message = document.getElementById("message");
      const logo = document.getElementById("logo");
      let index = 0;

      const glitchText = (next) => {
        message.classList.remove("glitching");
        void message.offsetWidth;
        message.textContent = next;
        message.dataset.text = next;
        message.classList.add("glitching");
        window.setTimeout(() => message.classList.remove("glitching"), 420);
      };

      window.setInterval(() => {
        index = (index + 1) % messages.length;
        glitchText(messages[index]);
      }, 4000);

      window.setInterval(() => {
        logo.classList.remove("glitching");
        void logo.offsetWidth;
        logo.classList.add("glitching");
        window.setTimeout(() => logo.classList.remove("glitching"), 470);
      }, 5000);
    })();
  </script>
</body>
</html>
